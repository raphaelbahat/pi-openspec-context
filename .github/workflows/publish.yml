name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Upgrade npm to version 11 (required for Trusted Publishing)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify build and test suite
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Publish to NPM
        run: npm publish --access public
