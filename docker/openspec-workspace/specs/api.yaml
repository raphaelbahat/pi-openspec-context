title: "REST API Specification"
version: "1.0.0"
paths:
  /api/users:
    get:
      summary: "Get all users"
      responses:
        200:
          description: "List of users"
  /api/users/{id}:
    get:
      summary: "Get user by ID"
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          description: "User details"